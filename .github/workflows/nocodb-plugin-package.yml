name: Build NocoDB plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Wox.Plugin.NocoDB/**"
      - ".github/workflows/nocodb-plugin-package.yml"
  push:
    branches:
      - master
    tags:
      - "nocodb-v*"
    paths:
      - "Wox.Plugin.NocoDB/**"
      - ".github/workflows/nocodb-plugin-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Wox.Plugin.NocoDB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Wox.Plugin.NocoDB/package-lock.json
      - run: npm ci
      - run: npm test
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: Wox.Plugin.NocoDB-package
          path: Wox.Plugin.NocoDB/release/Wox.Plugin.NocoDB.wox
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/nocodb-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wox.Plugin.NocoDB-package
      - name: Publish tagged release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" Wox.Plugin.NocoDB.wox --repo "${GITHUB_REPOSITORY}" --clobber
